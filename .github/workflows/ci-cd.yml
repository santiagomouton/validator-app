name: CI-CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/validator-api

jobs:

  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Docker
      uses: docker/setup-docker-action@v5.4.0
      with:
        github-token: # optional, default is ${{ github.token }}
    - name: Build proxy-nginx image
      run: docker build project/backend/ --file project/backend/Dockerfile --tag $IMAGE_NAME:$(date +%s)
    - name: Build api image
      run: docker build project/backend/ --file project/backend/Dockerfile --tag $IMAGE_NAME:$(date +%s)
    - name: Docker Login
      uses: docker/login-action@v4.6.0
      with:
        registry:
        username:
        password: # optional
        # Specifies whether the given registry is ECR (auto, true or false)
        ecr: # optional
        # Scope for the authentication token
        scope: # optional
        # Raw authentication to registries, defined as YAML objects
        registry-auth: # optional
    - name: push to registry
      run: docker push 
    - name: push to registry
      run: docker push

  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup ssh
        uses: kielabokkie/ssh-key-and-known-hosts-action@v1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
          ssh-host: your-server.com
          ssh-port: ${{ secrets.SSH_PORT }}
      - name: scp compose file to remote server
        run: | 
          scp app.sh project/compose.yml project/.env.testing project/.env.testing ${{ secrets.SSH_USER }}@your-server.com:/home/user/app/
      - name: run app on remote server
        run: |
          ssh ${{ secrets.SSH_USER }}@your-server.com "cd /home/user/app && bash app.sh start --testing"
    
      